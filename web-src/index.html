<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0e0e0e" />
<title>Odium Weather</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0e0e0e; -webkit-text-size-adjust: 100%; }
  #root { width: 100vw; height: 100vh; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  .leaflet-container {
    background: #0e0e0e;
    font-family: 'Roboto Condensed', sans-serif;
  }
  .leaflet-control-attribution {
    background: rgba(10,10,10,0.7) !important;
    color: #8a8a8a !important;
  }
  .leaflet-control-attribution a { color: #c8c8c8 !important; }
</style>
<link rel="stylesheet" href="./bundle.css" />
</head>
<body>
  <div id="root"></div>
  <script src="./android-bridge.js"></script>
  <script src="./bundle.js"></script>
</body>
</html>
